<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="생일 축하해, 소헌!">
<meta property="og:description" content="케이크가 다 만들어지면 터치해서 촛불을 꺼 주세요.">
<title>SH's Birthday Cake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: a party table. Pastel sky with drifting balloons and confetti, a big greeting, the dark
     ASCII "screen" as the centrepiece, then a send-to-a-friend card. One festive light look. */
  :root {
    --party-a: #ffe6ee;
    --party-b: #fff0da;
    --party-c: #ece4ff;
    --ink: #3b2342;
    --ink-soft: #7a5f80;
    --berry: #ff4f7b;
    --gold: #f2b33d;
    --paper: #ffffff;
    --line: #f3c9d6;
    --card: #0a0c14;
    --edge: #1a1e2c;
    --fg: #d8dae6;
    --dim: #6b7090;
    --amber: #ffb35c;
    --cur: #141a2c;
    --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
    --body: "Gowun Dodum", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    color-scheme: light;
  }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(165deg, var(--party-a) 0%, var(--party-b) 48%, var(--party-c) 100%) fixed;
    background-color: var(--party-a);
    color: var(--ink);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 44px;
    box-sizing: border-box;
    overflow-x: hidden;
    word-break: keep-all;
  }
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .balloon {
    position: absolute; left: var(--x); bottom: -140px;
    width: 46px; height: 58px; border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
    background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .75) 0 10%, transparent 11%), var(--c);
    opacity: .85;
    animation: rise var(--d) linear var(--s) infinite;
  }
  .balloon::after {
    content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 70px;
    background: linear-gradient(var(--ink-soft), transparent); opacity: .4;
  }
  @keyframes rise {
    0% { transform: translate(0, 0) rotate(-4deg); }
    50% { transform: translate(18px, -60vh) rotate(4deg); }
    100% { transform: translate(-10px, -125vh) rotate(-3deg); }
  }
  .confetti {
    position: absolute; left: var(--x); top: -20px; width: 8px; height: 13px; border-radius: 2px;
    background: var(--c); opacity: .8;
    animation: fall var(--d) linear var(--s) infinite;
  }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); }
    100% { transform: translate(40px, 110vh) rotate(720deg); }
  }
  .wrap { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .greet { text-align: center; display: flex; flex-direction: column; gap: 6px; max-width: 560px; }
  .greet .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--berry); }
  .greet h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 58px); line-height: 1.08; margin: 0; text-wrap: balance; }
  .greet h1 .name { color: var(--berry); }
  .greet p { margin: 0; color: var(--ink-soft); font-size: 15.5px; line-height: 1.55; }
  .card {
    width: 100%; max-width: 560px;
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--paper), 0 24px 60px rgba(120, 50, 110, .28);
  }
  canvas#scene { display: block; width: 100%; height: auto; aspect-ratio: 768 / 1008; max-width: 100%; cursor: pointer; background: #070912; }
  .tabbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 8px 14px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    font-family: var(--mono); font-size: 12px; color: var(--fg);
  }
  .tabbar .file { border-bottom: 2px solid #4a7dff; padding-bottom: 3px; }
  .tabbar .status { color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .code[hidden] { display: none; }
  .code { position: relative; height: calc(12 * 1.55em); overflow: hidden; font-family: var(--mono); font-size: clamp(9.5px, 2.5vw, 11.5px); line-height: 1.55; min-width: 0; }
  .code .inner { transition: transform .35s ease; will-change: transform; }
  .code .ln { display: flex; gap: 14px; padding: 0 14px; white-space: pre; overflow: hidden; }
  .code .ln.cur { background: var(--cur); }
  .code .no { color: #3b4058; min-width: 3ch; text-align: right; flex: none; }
  .code .ln.cur .no { color: #8a90b0; }
  .code .tx { color: #b7bbd0; overflow: hidden; text-overflow: clip; }
  .k { color: #c792ea; } .s { color: #c3e88d; } .n { color: #f78c6c; } .c { color: #4f5672; font-style: italic; } .f { color: #82aaff; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .controls button, .linkrow button {
    font-family: var(--body); font-size: 14px; cursor: pointer; border-radius: 999px; padding: 9px 18px;
  }
  .controls button { color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); }
  .controls button:hover { border-color: var(--berry); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
  .hint { color: var(--ink-soft); font-size: 13px; text-align: center; }
  .share {
    width: 100%; max-width: 560px; box-sizing: border-box;
    background: var(--paper); border-radius: 18px; padding: 18px;
    box-shadow: 0 14px 40px rgba(120, 50, 110, .14);
    display: grid; gap: 12px;
  }
  .share h2 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 0; }
  .share-body { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .qr { width: 132px; height: 132px; padding: 8px; border: 2px dashed var(--line); border-radius: 14px; flex: none; background: var(--paper); }
  .qr img, .qr canvas { width: 100% !important; height: auto !important; display: block; }
  .share-text { flex: 1 1 220px; min-width: 0; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.55; }
  .share-text p { margin: 0; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow input {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--ink);
    padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: #fffafc;
  }
  .linkrow button { color: #fff; background: var(--berry); border: none; white-space: nowrap; }
  details { font-size: 13.5px; color: var(--ink-soft); }
  summary { cursor: pointer; color: var(--ink); }
  details p { margin: 6px 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .balloon, .confetti { animation: none; display: none; }
    .code .inner { transition: none; }
  }
</style>

<div class="wrap">
  <header class="greet">
    <span class="eyebrow">made with code · just for you</span>
    <h1>생일 축하해, <span class="name" id="greetName">소헌</span>!</h1>

      <span class="file">birthday_cake.js</span>
      <span class="status" id="status">● running · 30 fps</span>

        <p>휴대폰 카메라로 QR 코드를 찍거나, 링크를 복사해서 카카오톡으로 보내 주세요.</p>
        <div class="linkrow">
          <input id="shareUrl" type="text" readonly aria-label="공유 링크">
          <button id="btnCopy" type="button">링크 복사</button>
        </div>
        <details>
          <summary>친구 폰에서 안 열리면?</summary>
          <p>페이지 오른쪽 위 <b>Share</b> 메뉴에서 공개 범위를 <b>링크가 있는 모든 사람</b>으로 바꿔 주세요. 그러면 로그인 없이 바로 열려요.</p>
        </details>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
const SOURCE = document.currentScript.textContent;

// @phase setup ─ grid, camera and light ──────────────────────────────────
const COLS = 96, ROWS = 84, CW = 8, CH = 12;   // character grid (cells are 8×12 px)
const ASP = CH / CW;                             // stretch x so circles stay round
const PHI = 0.27, CP = Math.cos(PHI), SP = Math.sin(PHI);   // camera looks down 15.5°
const SPIN = 0.42;                               // turntable speed (rad/s)
const L = norm([-0.48, 0.55, 0.72]);             // key light: upper left, in front
const HV = norm([L[0], L[1], L[2] + 1]);         // half vector for highlights
const TIERS = [[1.70, 0.00, 0.55], [1.28, 0.55, 1.27], [0.86, 1.27, 1.95]];  // radius, bottom, top
const PLATE = [1.95, -0.07, 0.0];
const TOP_Y = TIERS[2][2];
const CANDLE_H = 0.34, CANDLE_R = 0.46, NC = 5;
const LIGHT_Y = TOP_Y + CANDLE_H + 0.1;          // where the candle light lives
const RIDGES = [64, 48, 34], SCALLOPS = [14, 11, 8];
const RAMP = " .:-=+*#%@";                       // one dark→bright rule for every surface
const NAME = (/^#([A-Za-z0-9-]{1,12})$/.exec(location.hash) || [0, "SH"])[1];

// timeline (seconds)
const T_PLATE = 0.2, T_SCAN = 0.75, SCAN_V = 0.6;
const T_DEC = T_SCAN + TOP_Y / SCAN_V + 0.25;
const POP_GAP = 0.024, POP_DUR = 0.3, FLAME_GAP = 0.32, TITLE_GAP = 0.05, DIM_T = 2.2;

function norm(v) { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hsh(a, b, c) {
  let h = (Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663) ^ Math.imul(c | 0, 83492791)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

// @phase materials ─ colour ramps (shadow → light) ─────────────────────────
function ramp(stops) {
  const lut = [];
  for (let i = 0; i <= 64; i++) {
    const t = i / 64;
    let k = 0;
    while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const a = stops[k], b = stops[k + 1], u = clamp((t - a[0]) / (b[0] - a[0]), 0, 1);
    lut.push([a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u]);
  }
  return lut;
}
const MAT = [
  ramp([[0, 10, 12, 26], [0.2, 52, 56, 86], [0.4, 150, 152, 176], [0.6, 226, 227, 236], [0.8, 250, 250, 250], [1, 255, 255, 255]]), // 0 cream
  ramp([[0, 26, 8, 20], [0.45, 170, 66, 104], [0.8, 255, 150, 186], [1, 255, 222, 232]]),   // 1 pink ribbon
  ramp([[0, 36, 3, 10], [0.35, 130, 8, 26], [0.7, 226, 26, 48], [0.88, 255, 86, 92], [1, 255, 205, 200]]), // 2 strawberry
  ramp([[0, 8, 26, 12], [0.5, 36, 124, 52], [1, 150, 240, 130]]),                           // 3 leaf
  ramp([[0, 12, 14, 24], [0.5, 84, 92, 124], [1, 205, 214, 238]]),                           // 4 plate
  ramp([[0, 10, 12, 22], [1, 92, 100, 138]]),                                              // 5 table
  ramp([[0, 40, 30, 10], [1, 255, 216, 120]]),                                             // 6 seeds / gold
];
const WARM = [255, 150, 62];
const styleCache = new Map();
function mat(m, b, w) {
  const bq = b <= 0 ? 0 : b >= 1 ? 64 : (b * 64) | 0;
  const wq = w <= 0 ? 0 : w >= 1 ? 16 : (w * 16) | 0;
  const key = m * 4096 + bq * 32 + wq;
  let s = styleCache.get(key);
  if (!s) {
    const c = MAT[m][bq], k = wq / 16;
    s = `rgb(${Math.min(255, c[0] + WARM[0] * k) | 0},${Math.min(255, c[1] + WARM[1] * k * 0.8) | 0},${Math.min(255, c[2] + WARM[2] * k * 0.5) | 0})`;
    styleCache.set(key, s);
  }
  return s;
}
const rgbCache = new Map();
function rgb(r, g, b) {
  r = clamp(r | 0, 0, 255); g = clamp(g | 0, 0, 255); b = clamp(b | 0, 0, 255);
  const key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2);
  let s = rgbCache.get(key);
  if (!s) { s = `rgb(${r},${g},${b})`; rgbCache.set(key, s); }
  return s;
}
function rampChar(b, h) {
  const j = (h & 7) === 0 ? 0.7 : (h & 7) === 1 ? -0.7 : 0;   // tiny jitter so it feels hand-drawn
  return RAMP[clamp(Math.floor(b * 9.6 + j), 0, 9)];
}

// @phase layout ─ fit the cake into the grid ──────────────────────────────
const N = COLS * ROWS;
const SCENE_BOTTOM = ROWS - 14;
const yMax = (TOP_Y + CANDLE_H + 0.32) * CP + CANDLE_R * SP;
const yMin = PLATE[1] * CP - PLATE[0] * SP;
const SPAN = yMax - yMin;
const S = Math.min((SCENE_BOTTOM - 8) / SPAN, (COLS * 0.95) / (2 * PLATE[0] * ASP));
const CX = COLS / 2;
const CY = 8 + ((SCENE_BOTTOM - 8) - SPAN * S) / 2 + yMax * S;
const TITLE_ROW = SCENE_BOTTOM + 2;

function project(x, y, z) { return [x, y * CP - z * SP, y * SP + z * CP]; }

// @phase tiers ─ ray-cast every cell against the three cylinders ───────────
// Done once: the cake is round, so turning it only moves the surface texture.
function castTier(R, y0, y1, upperR, tier) {
  const cells = { idx: [], part: [], ang: [], rad: [], y: [], dif: [], spec: [], ao: [], z: [], warm: [] };
  const H = [HV[0], HV[1], HV[2]];
  for (let row = 0; row < SCENE_BOTTOM + 2; row++) {
    const Y = (CY - (row + 0.5)) / S;
    for (let col = 0; col < COLS; col++) {
      const X = (col + 0.5 - CX) / (S * ASP);
      if (Math.abs(X) > R) continue;
      let best = null;
      let z = Math.sqrt(R * R - X * X);            // front of the side wall
      let Z = (z + Y * SP) / CP, y = Y * CP + Z * SP;
      if (y >= y0 && y <= y1) best = [Z, 0, X, y, z];
      Z = (y1 - Y * CP) / SP; z = -Y * SP + Z * CP;  // flat top
      if (X * X + z * z <= R * R && (!best || Z > best[0])) best = [Z, 1, X, y1, z];
      if (!best) continue;
      const [ZZ, part, x, yy, zz] = best;
      const rad = Math.hypot(x, zz);
      let n, nc;                                     // world normal, camera normal
      if (part === 0) { n = [x / R, 0, zz / R]; nc = [n[0], -n[2] * SP, n[2] * CP]; }
      else { n = [0, 1, 0]; nc = [0, CP, SP]; }
      const dif = Math.max(0, nc[0] * L[0] + nc[1] * L[1] + nc[2] * L[2]);
      const spec = Math.pow(Math.max(0, nc[0] * H[0] + nc[1] * H[1] + nc[2] * H[2]), 28);
      let ao = 1;
      if (part === 0) {
        ao *= 0.5 + 0.5 * Math.sqrt(Math.max(0, nc[2]));          // edges turn away → darker
        if (tier >= 0) ao *= 1 - 0.45 * Math.exp(-(yy - y0) / 0.05); // contact shadow at the base
      } else if (upperR > 0 && rad > upperR) {
        ao *= 1 - 0.6 * Math.exp(-(rad - upperR) / 0.07);           // shadow ring round the tier above
      }
      const v = [-x, LIGHT_Y - yy, -zz], d = Math.hypot(v[0], v[1], v[2]);
      const nd = (n[0] * v[0] + n[1] * v[1] + n[2] * v[2]) / d;
      const warm = Math.max(0, (nd + 0.3) / 1.3) / (1 + 0.42 * d * d);   // candle light, wrapped
      cells.idx.push(row * COLS + col); cells.part.push(part); cells.ang.push(Math.atan2(zz, x));
      cells.rad.push(rad); cells.y.push(yy); cells.dif.push(dif); cells.spec.push(spec);
      cells.ao.push(ao); cells.z.push(ZZ); cells.warm.push(warm);
    }
  }
  return cells;
}
const BODY = [castTier(PLATE[0], PLATE[1], PLATE[2], TIERS[0][0], -1)];
TIERS.forEach(([R, y0, y1], i) => BODY.push(castTier(R, y0, y1, i < 2 ? TIERS[i + 1][0] : 0, i)));

// @phase background ─ night sky and a dotted table ─────────────────────────
const FLOOR = [], STARS = [];
{
  let seed = 7;
  const rnd = () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822519) + 0x9e3779b9 >>> 0) / 4294967296);
  for (let row = 0; row < SCENE_BOTTOM + 2; row++) {
    const Y = (CY - (row + 0.5)) / S;
    for (let col = 0; col < COLS; col++) {
      const X = (col + 0.5 - CX) / (S * ASP);
      const Z = (PLATE[1] - Y * CP) / SP, z = -Y * SP + Z * CP;
      if (z > -4.2) {
        let ch = "";
        if (row % 2 === 0) ch = col % 3 === 0 ? "." : "";
        else ch = col % 2 === 0 ? "-" : (col % 4 === 1 ? "." : "");
        if (!ch) continue;
        const far = clamp((z + 4.2) / 2.2, 0, 1);
        const r = Math.hypot(X, z);
        const ao = r < PLATE[0] + 0.5 ? 0.35 + 0.65 * clamp((r - PLATE[0]) / 0.5, 0, 1) : 1;
        FLOOR.push([row * COLS + col, ch, (0.18 + 0.5 * far) * ao, Math.exp(-(X * X + z * z) / 3.2) * far * ao]);
      } else if (row > 1 && rnd() < 0.045) {
        STARS.push([row * COLS + col, rnd() * 6.3, 0.5 + rnd() * 2.2, rnd()]);
      }
    }
  }
}

// @phase decor ─ strawberries, cream rosettes and piped beads ──────────────
const SPRITES = [];
let popT = T_DEC;
TIERS.forEach(([R, y0, y1], i) => {
  const nb = Math.floor((2 * Math.PI * R) / 0.12);
  const beadT = T_SCAN + (y0 + 0.08) / SCAN_V;
  for (let k = 0; k < nb; k++)
    SPRITES.push({ r: R + 0.02, a: (2 * Math.PI * (k + 0.5 * i)) / nb, y: y0 + 0.045, rad: 0.056, ey: 0.9, kind: "bead", pop: beadT });
});
const RIM = [12, 9, 6];
TIERS.forEach(([R, y0, y1], i) => {
  const n = RIM[i] * 2, rr = R - 0.16;
  for (let k = 0; k < n; k++) {
    const a = (2 * Math.PI * k) / n;
    if (k % 2 === 0) addBerry(rr, a, y1, 0.13, popT);
    else SPRITES.push({ r: rr, a, y: y1 + 0.075, rad: 0.12, ey: 0.8, kind: "rose", pop: popT });
    popT += POP_GAP;
  }
});
popT += 0.1;
for (let k = 0; k < 3; k++) { addBerry(0.14, (2 * Math.PI * k) / 3 + 0.5, TOP_Y, 0.1, popT); popT += 0.09; }
function addBerry(r, a, y1, rad, pop) {
  const yc = y1 + rad * 1.3 * 0.82;
  SPRITES.push({ r, a, y: yc, rad, ey: 1.3, kind: "berry", pop });   // hulled, tip pointing up
}
const N_BERRIES = SPRITES.filter((s) => s.kind === "berry").length;
const CANDLES = [[255, 122, 170], [116, 184, 255], [255, 210, 92], [140, 228, 160], [196, 150, 255]]
  .map((c, k) => ({ a: (2 * Math.PI * k) / NC + 0.35, c }));
const T_CANDLE = popT + 0.35, T_FLAME = T_CANDLE + 0.75;
const TITLE = ("HAPPY BIRTHDAY " + NAME).split("").join(" ");
const T_TITLE = T_FLAME + NC * FLAME_GAP + 0.3;
const T_DONE = T_TITLE + TITLE.length * TITLE_GAP;
const TITLE_STEP = 14.5;                         // px between letters of the big title
let titleGlyphs = [];
const DUST = [];                                 // gold dust cells around the title
{
  const half = (TITLE_STEP * (TITLE.length - 1)) / 2 / CW;
  let seed = 31;
  const rnd = () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822519) + 0x9e3779b9 >>> 0) / 4294967296);
  while (DUST.length < 70) {
    const col = Math.floor(CX + (rnd() * 2 - 1) * (half + 7));
    const row = TITLE_ROW + Math.round((rnd() * 2 - 1) * 4);
    if (Math.abs(row - TITLE_ROW) <= 1 && Math.abs(col + 0.5 - CX) <= half + 1.5) continue;
    if (row > ROWS - 7 || col < 0 || col >= COLS) continue;
    DUST.push([row * COLS + col, rnd() * 6.3, 0.8 + rnd() * 2.2]);
  }
}

// gold glitter pressed into the cream
const GLITTER = [];
{
  let seed = 99;
  const rnd = () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822519) + 0x9e3779b9 >>> 0) / 4294967296);
  TIERS.forEach(([R, y0, y1], i) => {
    const inner = i < 2 ? TIERS[i + 1][0] : 0.3;
    for (let k = 0; k < 26 * R; k++) {
      if (rnd() < 0.5) GLITTER.push([Math.sqrt(inner * inner + rnd() * (R * R - inner * inner)) * 0.97, rnd() * 6.3, y1 + 0.004, 1, rnd() * 6.3, 0.6 + rnd() * 1.3]);
      else GLITTER.push([R + 0.004, rnd() * 6.3, y0 + 0.06 + rnd() * (y1 - y0 - 0.12), 0, rnd() * 6.3, 0.6 + rnd() * 1.3]);
    }
  });
}

// @phase blow ─ tap, and the candles go out one by one ──────────────────────
let blowT = -1, puffed = new Set();
const OUT_GAP = 0.22, TRANS_DUR = 1.1;
function outAt(k) { return blowT < 0 ? Infinity : blowT + 0.35 + k * OUT_GAP; }
function isLit(k, t) { return t >= T_FLAME + k * FLAME_GAP && t < outAt(k); }
function litCount(t) { let n = 0; for (let k = 0; k < NC; k++) if (isLit(k, t)) n++; return n; }
function transAt() { return blowT + 0.35 + (NC - 1) * OUT_GAP + 1.9; }
function smoke(x, y, z, big) {
  parts.push({ x, y, z, vx: (Math.random() - 0.3) * (big ? 0.25 : 0.08), vy: 0.18 + Math.random() * 0.14, vz: (Math.random() - 0.5) * 0.05,
    age: 0, life: 1.3 + Math.random() * 1.1, hot: [190, 190, 205], cold: [40, 42, 58], chars: big ? "@(~)'." : "(~)~'.", g: -0.03 });
}

// @phase render ─ one frame ────────────────────────────────────────────────
const CHS = new Array(N), STY = new Array(N), ZB = new Float32Array(N), EM = new Float32Array(N);
let parts = [], litDone = new Set(), lastScanSpark = 0;
const confetti = Array.from({ length: 16 }, (_, k) => newConfetti(true, k));
function newConfetti(initial, k = Math.random() * 100) {
  const pal = [[255, 130, 170], [130, 200, 255], [255, 220, 120], [170, 240, 180], [210, 170, 255]];
  return { x: (Math.random() * 2 - 1) * 2.4, y: initial ? 2.6 + Math.random() * 3 : 2.7, z: (Math.random() * 2 - 1) * 1.8,
    v: 0.12 + Math.random() * 0.18, ph: Math.random() * 6.3, c: pal[(k | 0) % pal.length] };
}
function put(i, ch, sty, z, em) { CHS[i] = ch; STY[i] = sty; ZB[i] = z; EM[i] = em; }
function dot(x, y, z, ch, sty, em) {
  const [X, Y, Z] = project(x, y, z);
  const col = Math.floor(CX + X * S * ASP), row = Math.floor(CY - Y * S);
  if (row >= 0 && row < SCENE_BOTTOM + 2 && col >= 0 && col < COLS) {
    const i = row * COLS + col;
    if (Z > ZB[i]) put(i, ch, sty, Z, em);
  }
}
let letters = 0, flames = [];

function drawFrame(t, dt) {
  CHS.fill(""); STY.fill(""); ZB.fill(-1e9); EM.fill(0);
  const th = t * SPIN;
  const lit = litCount(t);
  const dim = clamp((t - T_TITLE) / DIM_T, 0, 1);
  const out = blowT < 0 ? 0 : clamp((t - blowT - 0.35) / (NC * OUT_GAP + 0.6), 0, 1);
  const bg = (1 - 0.55 * dim) * (1 - 0.35 * out);  // the room goes dark once every candle is lit…
  const amb = (1 - 0.08 * dim) * (1 - 0.5 * out);  // …the cake stays bright until they are blown out
  const fl = lit ? (lit / NC) * (0.86 + 0.08 * Math.sin(t * 11.3) * Math.sin(t * 6.7 + 1) + 0.05 * Math.sin(t * 2.1) + 0.06 * (Math.random() - 0.5)) : 0;
  const scanY = t < T_SCAN ? -1 : (t - T_SCAN) * SCAN_V;
  const scanning = scanY >= 0 && scanY < TOP_Y + 0.05;
  letters = 0;
  flames = [];

  // sky + table
  for (const [i, ph, sp, depth] of STARS) {
    const b = (0.5 + 0.5 * Math.sin(t * sp + ph)) * (0.35 + 0.65 * depth) * (0.45 + 0.55 * bg);
    if (b < 0.16) continue;
    put(i, b > 0.62 && depth > 0.6 ? "+" : depth > 0.85 && b > 0.5 ? "*" : ".", rgb(150 * b + 40, 160 * b + 42, 210 * b + 50), -1e8, b > 0.6 ? b * 0.5 : 0);
  }
  for (const [i, ch, base, glow] of FLOOR) {
    const w = glow * fl * 0.85;
    put(i, ch, mat(5, base * bg + w * 0.9, w * 0.7), -1e8, w * 0.25);
  }

  // cake body
  const plateIn = clamp((t - T_PLATE) / 0.45, 0, 1);
  for (let tier = -1; tier < 3; tier++) {
    const B = BODY[tier + 1];
    if (tier < 0 && plateIn <= 0) continue;
    const y1 = tier < 0 ? PLATE[2] : TIERS[tier][2];
    const n = B.idx.length;
    for (let k = 0; k < n; k++) {
      const part = B.part[k], y = B.y[k];
      if (tier >= 0 && (part === 0 ? y > scanY : y1 > scanY)) continue;
      const i = B.idx[k], Z = B.z[k];
      if (Z <= ZB[i]) continue;
      const a = B.ang[k] - th, ao = B.ao[k], rad = B.rad[k];
      const w = B.warm[k] * fl;
      let b, m = 0, h, ch, em;
      if (tier < 0) {
        b = ((0.16 + 0.84 * B.dif[k]) * amb * ao * (part === 0 ? 0.8 : 0.62) + w * 0.6) * plateIn;
        h = hsh(rad * 40 | 0, a * 9 | 0, 5);
        m = 4;
      } else if (part === 0) {
        const tex = 0.9 + 0.1 * Math.cos(a * RIDGES[tier]);
        b = (0.2 + 0.8 * B.dif[k]) * amb * ao * tex + B.spec[k] * 0.5 * amb * ao + w * 0.6 * ao;
        h = hsh(Math.floor(a * TIERS[tier][0] * S * ASP * 0.9), Math.floor(y * S * CP), tier);
        const sw = Math.abs(Math.sin(a * SCALLOPS[tier] * 0.5));
        const d = y1 - 0.09 - 0.11 * sw;
        const thr = 0.55 / (S * CP);
        if (Math.abs(y - d) < thr) { m = 1; b = b * 0.95 + 0.08; ch = "~"; }
        else if (sw < 0.1 && Math.abs(y - (y1 - 0.09)) < thr * 1.4) { m = 1; b = Math.min(1, b + 0.25); ch = "o"; }
        if (scanning && scanY - y < 0.06) { put(i, "=", rgb(200, 240, 255), Z, 0.45); letters++; continue; }
      } else {
        const tex = 0.94 + 0.06 * Math.cos(rad * 42);
        b = (0.2 + 0.8 * B.dif[k]) * amb * ao * tex + B.spec[k] * 0.35 * amb * ao + w * 0.6 * ao;
        h = hsh(Math.floor(rad * Math.cos(a) * S * 1.4), Math.floor(rad * Math.sin(a) * S * 1.4), tier + 7);
      }
      if (!ch) ch = rampChar(b, h);
      em = 0.06 * b + (b > 0.93 ? 0.12 : 0) + w * 0.15;
      put(i, ch, mat(m, b, w * 0.9 * (m === 0 ? 0.55 : 0.4)), Z, em);
      if (ch !== " ") letters++;
    }
  }

  // the bright cut face while the cake is being "printed" from the bottom up
  if (scanning) {
    const tier = TIERS.findIndex(([, y0, y1]) => scanY >= y0 && scanY <= y1);
    if (tier >= 0) {
      const R = TIERS[tier][0];
      const Y0 = scanY * CP, r0 = Math.floor(CY - (Y0 + R * SP) * S), r1 = Math.ceil(CY - (Y0 - R * SP) * S);
      const c0 = Math.floor(CX - R * S * ASP), c1 = Math.ceil(CX + R * S * ASP);
      for (let row = Math.max(0, r0); row <= Math.min(SCENE_BOTTOM, r1); row++) {
        const Y = (CY - (row + 0.5)) / S;
        for (let col = Math.max(0, c0); col <= Math.min(COLS - 1, c1); col++) {
          const X = (col + 0.5 - CX) / (S * ASP);
          const Z = (scanY - Y * CP) / SP, z = -Y * SP + Z * CP;
          const rr = X * X + z * z;
          if (rr > R * R) continue;
          const i = row * COLS + col;
          if (Z <= ZB[i]) continue;
          const edge = Math.sqrt(rr) / R;
          const hh = hsh(col, row, (t * 12) | 0);
          put(i, edge > 0.9 ? "#" : "=-:."[hh & 3], rgb(120 + 100 * edge, 190 + 50 * edge, 235), Z, 0.08 + 0.3 * edge);
          letters++;
        }
      }
      if (t - lastScanSpark > 0.03) {
        lastScanSpark = t;
        const a = Math.random() * Math.PI;
        parts.push({ x: R * Math.cos(a), y: scanY, z: R * Math.sin(a), vx: Math.cos(a) * 0.5, vy: 0.25 + Math.random() * 0.3, vz: Math.sin(a) * 0.5,
          age: 0, life: 0.5 + Math.random() * 0.3, hot: [220, 250, 255], cold: [60, 120, 200], chars: "*+'.", g: 0.6 });
      }
    }
  }

  // strawberries, rosettes, beads
  for (let s = 0; s < SPRITES.length; s++) {
    const sp = SPRITES[s];
    const u = (t - sp.pop) / POP_DUR;
    if (u <= 0) continue;
    const scale = u >= 1 ? 1 : u * (1 + 0.4 * Math.sin(Math.PI * u));
    const wa = sp.a + th;
    const [X, Y, Z] = project(sp.r * Math.cos(wa), sp.y, sp.r * Math.sin(wa));
    const d2 = sp.r * sp.r + (sp.y - LIGHT_Y) ** 2;
    letters += sprite(sp, X, Y, Z, sp.rad * scale, fl / (1 + 0.42 * d2) * (sp.y > TOP_Y - 0.01 ? 1 : 0.7), amb, s);
  }

  // candles + flames
  CANDLES.forEach((cd, k) => {
    const grow = clamp((t - T_CANDLE - k * 0.08) / 0.45, 0, 1);
    if (grow > 0) letters += candle(cd, k, cd.a + th, grow, isLit(k, t), t, amb, fl);
  });

  // glitter
  if (t >= T_TITLE) {
    const fade = clamp((t - T_TITLE) / 1.5, 0, 1);
    for (const [r, al, y, top, ph, sp] of GLITTER) {
      const s = Math.sin(t * sp + ph) * fade;
      if (s < 0.6) continue;
      const wa = al + th;
      if (!top && Math.sin(wa) < 0.12) continue;
      const [X, Y, Z] = project(r * Math.cos(wa), y, r * Math.sin(wa));
      const col = Math.floor(CX + X * S * ASP), row = Math.floor(CY - Y * S);
      if (row < 0 || col < 0 || col >= COLS || row > SCENE_BOTTOM) continue;
      const i = row * COLS + col, q = (s - 0.6) / 0.4;
      if (Z + 0.05 > ZB[i]) put(i, q > 0.65 ? "*" : q > 0.3 ? "+" : ".", rgb(255, 214 + 30 * q, 110 + 120 * q), Z + 0.05, 0.5 + 0.5 * q);
    }
  }

  // sparks and confetti
  parts = parts.filter((p) => {
    p.age += dt;
    if (p.age >= p.life) return false;
    p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const f = 1 - p.age / p.life;
    const c = p.cold.map((v, j) => v + (p.hot[j] - v) * f);
    dot(p.x, p.y, p.z, p.chars[Math.min(p.chars.length - 1, Math.floor((1 - f) * p.chars.length))], rgb(c[0], c[1], c[2]), 0.6 * f);
    return true;
  });
  if (t >= T_TITLE) {
    for (const c of confetti) {
      c.y -= c.v * dt;
      c.x += 0.1 * Math.sin(t * 1.2 + c.ph) * dt;
      if (c.y < PLATE[1]) Object.assign(c, newConfetti(false));
      const k = 0.5 + 0.5 * bg;
      dot(c.x, c.y, c.z, "*+x'.o"[Math.floor(t * 4 + c.ph * 3) % 6], rgb(c.c[0] * k, c.c[1] * k, c.c[2] * k), 0.15);
    }
  }

  drawHud(t, th);
}

function sprite(sp, X, Y, Z, rad, warm, amb, sid) {
  const sx = CX + X * S * ASP, sy = CY - Y * S;
  const rx = Math.max(0.8, rad * S * ASP), ry = Math.max(0.6, rad * sp.ey * S);
  let drawn = 0;
  const r0 = Math.max(0, Math.floor(sy - ry)), r1 = Math.min(SCENE_BOTTOM, Math.floor(sy + ry));
  const c0 = Math.max(0, Math.floor(sx - rx)), c1 = Math.min(COLS - 1, Math.floor(sx + rx));
  for (let row = r0; row <= r1; row++) {
    const dy = (sy - (row + 0.5)) / ry;
    for (let col = c0; col <= c1; col++) {
      let dx = (col + 0.5 - sx) / rx;
      if (sp.kind === "berry") dx /= 0.6 + 0.2 * (1 - dy);      // round shoulders below, pointed tip on top
      const q = dx * dx + dy * dy;
      if (q > 1) continue;
      const nz = Math.sqrt(1 - q);
      const z = Z + nz * rad, i = row * COLS + col;
      if (z <= ZB[i]) continue;
      const d = Math.max(0, dx * L[0] + dy * L[1] + nz * L[2]);
      const spec = Math.pow(Math.max(0, dx * HV[0] + dy * HV[1] + nz * HV[2]), 22);
      let b = (0.16 + 0.84 * d) * amb + warm * 0.7;
      const h = hsh(col, row, sid);
      let ch, sty, em = 0.05;
      if (sp.kind === "berry") {
        b = b * 0.85 + spec * 0.6 * amb;
        if (h % 6 === 0 && nz > 0.35) { ch = h & 8 ? "'" : ","; sty = mat(6, 0.55 + 0.45 * b, warm * 0.2); }
        else { ch = rampChar(0.35 + 0.65 * b, h); sty = mat(2, b, warm * 0.25); }
        em = spec * 0.5 + 0.04;
      } else if (sp.kind === "leaf") {
        ch = "v^w*"[h & 3]; sty = mat(3, 0.3 + 0.7 * b, warm * 0.2);
      } else {
        if (sp.kind === "rose") b *= 0.82 + 0.18 * Math.sin(Math.atan2(dy, dx) * 3 + Math.sqrt(q) * 9);
        b += spec * 0.35 * amb;
        ch = rampChar(b, h); sty = mat(0, b, warm * 0.5);
        em = 0.05 * b + (b > 0.93 ? 0.1 : 0);
      }
      if (ch === " ") ch = ".";
      put(i, ch, sty, z, em);
      drawn++;
    }
  }
  return drawn;
}

// @phase candles ─ rise, then light one by one ─────────────────────────────
function candle(cd, k, wa, grow, lit, t, amb, fl) {
  const xw = CANDLE_R * Math.cos(wa), zw = CANDLE_R * Math.sin(wa);
  const [X, Yb] = project(xw, TOP_Y, zw);
  const Yt = (TOP_Y + CANDLE_H * grow) * CP - zw * SP;
  const sx = CX + X * S * ASP, rowT = Math.floor(CY - Yt * S), rowB = Math.floor(CY - Yb * S);
  const wc = Math.max(2, Math.round(0.075 * S * ASP));
  const c0 = Math.floor(sx - wc / 2 + 0.5);
  let drawn = 0;
  for (let row = rowT; row <= rowB; row++) {
    if (row < 0 || row > SCENE_BOTTOM) continue;
    const yobj = ((CY - (row + 0.5)) / S + zw * SP) / CP;
    const Z = yobj * SP + zw * CP + 0.06;
    for (let c = c0; c < c0 + wc; c++) {
      if (c < 0 || c >= COLS) continue;
      const i = row * COLS + c;
      if (Z <= ZB[i]) continue;
      const u = ((c - c0 + 0.5) / wc) * 2 - 1;
      const stripe = Math.floor((yobj - TOP_Y) * 20 + u * 1.3 + wa * 1.6) & 1;
      const base = stripe ? cd.c : [250, 244, 250];
      const b = (0.95 - 0.4 * (u + 1) / 2) * (0.45 + 0.55 * amb) + fl * 0.3;
      put(i, Math.abs(u) > 0.55 ? "|" : "#", rgb(base[0] * b, base[1] * b, base[2] * b), Z, 0.05);
      drawn++;
    }
  }
  if (!lit) {
    const since = t - outAt(k);
    if (since >= 0 && since < 2.6) {                     // blown out: a puff, then a thin trail of smoke
      const wy = TOP_Y + CANDLE_H + 0.06;
      if (!puffed.has(k)) { puffed.add(k); for (let j = 0; j < 6; j++) smoke(xw, wy, zw, true); }
      if (Math.random() < 0.5 * (1 - since / 2.6)) smoke(xw, wy, zw, false);
      if (since < 1 && rowT - 1 >= 0) put((rowT - 1) * COLS + Math.floor(sx), ".", rgb(255, 120 - 60 * since, 40), 1e6, 0.6 * (1 - since));
    }
    return drawn;
  }
  if (!litDone.has(k)) {
    litDone.add(k);
    for (let j = 0; j < 9; j++) {
      const a = Math.random() * 6.3;
      parts.push({ x: xw, y: TOP_Y + CANDLE_H + 0.1, z: zw, vx: Math.cos(a) * 0.3, vy: 0.4 + Math.random() * 0.4, vz: Math.sin(a) * 0.3,
        age: 0, life: 0.5 + Math.random() * 0.4, hot: [255, 246, 200], cold: [255, 130, 40], chars: "*+'.", g: 0.8 });
    }
  }
  const fx = Math.floor(sx), Zf = (TOP_Y + CANDLE_H) * SP + zw * CP + 0.08;
  const lean = blowT >= 0 && t >= blowT ? (t - blowT > 0.15 ? 2 : 1) : 0;   // the gust bends the flame
  const sway = lean || (Math.sin(t * 9 + k * 2) > 0.6 ? 1 : Math.sin(t * 7 + k) < -0.7 ? -1 : 0);
  const tall = S > 12 ? 4 : 3;
  const shape = [
    [rowT - 1, fx, "@0"[(t * 10 + k) & 1], [255, 252, 225], 1.0],
    [rowT - 2, fx + (lean > 1 ? 1 : 0), "A8"[(t * 7 + k) & 1], [255, 214, 110], 0.95],
    [rowT - 3, fx + sway, "^*"[(t * 9 + k) & 1], [255, 150, 50], 0.8],
  ];
  if (tall === 4) shape.push([rowT - 4, fx + sway, "'`"[(t * 5 + k) & 1], [255, 110, 40], 0.5]);
  if (wc > 2) shape.push([rowT - 1, fx - 1, "(", [255, 196, 90], 0.7], [rowT - 1, fx + 1, ")", [255, 196, 90], 0.7]);
  for (const [row, c, ch, col, em] of shape) {
    if (row < 0 || c < 0 || c >= COLS) continue;
    const i = row * COLS + c;
    if (Zf > ZB[i]) { put(i, ch, rgb(col[0], col[1], col[2]), Zf, em); drawn++; }
  }
  flames.push([fx + 0.5, rowT - 1.5, Zf]);
  if (Math.random() < 0.18)
    parts.push({ x: xw, y: TOP_Y + CANDLE_H + 0.16, z: zw, vx: (Math.random() - 0.5) * 0.1, vy: 0.3, vz: 0,
      age: 0, life: 0.5 + Math.random() * 0.5, hot: [255, 240, 190], cold: [255, 120, 40], chars: "*''.", g: 0 });
  return drawn;
}

// @phase light ─ title, timer and stats while the room dims ──────────────
function drawHud(t, th) {
  const text = (row, col, str, sty, em = 0) => {
    for (let j = 0; j < str.length; j++) {
      const c = col + j;
      if (c >= 0 && c < COLS && str[j] !== " ") put(row * COLS + c, str[j], sty, 1e9, em);
    }
  };
  // title types itself in, one letter at a time, colours drifting (painted large in paint())
  titleGlyphs = [];
  if (t >= T_TITLE) {
    const x0 = (W - TITLE_STEP * (TITLE.length - 1)) / 2;
    for (let j = 0; j < TITLE.length; j++) {

const TEXT_TOP = 3;

  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const [str, size, y] of [["HAPPY", 92, 62], ["BIRTHDAY", 92, 166], [NAME, 120, 290]]) {
    g.font = `700 ${size}px ${mono}`;
    const w = g.measureText(str).width;
    g.font = `700 ${w > W * 0.9 ? (size * W * 0.9) / w : size}px ${mono}`;

function drawTextParticles(ct, t) {
  if (ct < T_TEXT) return;

  if (!FW.textStarted) {                                    // one big burst flings every spark to its letter
    burst(sx, sy, "willow", 1); burst(sx - 24, sy + 4, "chrys", 0.8); burst(sx + 24, sy + 4, "chrys", 0.8);

// @phase music ─ a little music box plays the birthday song ────────────────
const SONG = [                                   // [note, beats] — 3/4 with a one-beat pickup
  ["G4", 0.75], ["G4", 0.25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
  ["G4", 0.75], ["G4", 0.25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
  ["G4", 0.75], ["G4", 0.25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2],
  ["F5", 0.75], ["F5", 0.25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 2],

// @phase paint ─ characters, then a soft bloom on top ──────────────────────
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const glow = document.createElement("canvas"), gctx = glow.getContext("2d");

const W = COLS * CW, Hh = ROWS * CH;
let dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = Hh * dpr;
  glow.width = W / 4; glow.height = Hh / 4;
  glow2.width = W / 10; glow2.height = Hh / 10;
}
resize();
window.addEventListener("resize", resize);

function paint(t, offY, fade, city) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, Hh);
  if (city) {
    sky.addColorStop(0, "#03040a"); sky.addColorStop(0.5, "#0b0a1c"); sky.addColorStop(WL / ROWS, "#1c1434");
    sky.addColorStop(WL / ROWS + 0.01, "#05070e"); sky.addColorStop(1, "#04050a");
  } else { sky.addColorStop(0, "#05060c"); sky.addColorStop(0.55, "#0a0d1a"); sky.addColorStop(1, "#06070c"); }

    const [fr, fg, fb] = FW.flashC;
    ctx.fillStyle = `rgba(${fr},${fg},${fb},${0.08 * FW.flash})`; ctx.fillRect(0, 0, W, WL * CH);
    ctx.fillStyle = `rgba(${fr},${fg},${fb},${0.03 * FW.flash})`; ctx.fillRect(0, WL * CH, W, (WATER_END - WL) * CH);
  }

    const k = (lit / NC) * 0.22;

  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  gctx.clearRect(0, 0, glow.width, glow.height);

    const ch = CHS[i];
    if (!ch || ch === " ") continue;
    const sty = STY[i];
    if (sty !== last) { ctx.fillStyle = sty; last = sty; }
    const col = i % COLS, row = (i / COLS) | 0;
    ctx.fillText(ch, (col + 0.5) * CW, (row + 0.5) * CH);

  ctx.globalAlpha = 0.65; ctx.drawImage(glow2, 0, 0, W, Hh);

    const x = fx * CW, y = fy * CH, g = ctx.createRadialGradient(x, y, 1, x, y, CH * 3.2);

// @phase loop ─ 30 fps, pause and replay ───────────────────────────────────
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const hintEl = document.getElementById("hint");
const statusEl = document.getElementById("status");

  if (real < 1 / 31) return;
  lastNow = now;
  const dt = Math.min(0.1, real);
  fps = fps * 0.9 + 0.1 / Math.max(real, 1e-3);
  if (!paused) t += dt;
  const d = paused ? 0 : dt;
  if (scene === "cake" && blowT >= 0 && t >= transAt() + TRANS_DUR) startCity();
  if (scene === "cake") {
    drawFrame(t, d);
    const k = blowT >= 0 ? clamp((t - transAt()) / TRANS_DUR, 0, 1) : 0;
    paint(t, k * k * Hh * 0.3, k, false);
  } else {
    const ct = t - cityT0, k = clamp(ct / 1.4, 0, 1);
    drawCity(ct, d, t);
    paint(t, -(1 - k) * (1 - k) * Hh * 0.25, 1 - k, true);
  }
  updateCode(t);
  updateHint();
  if (now - statusAt > 500) {

    statusEl.textContent = paused ? "● paused" : `● running · ${Math.round(Math.min(30, fps))} fps`;
  }
}
function setPaused(p) {
  paused = p; document.getElementById("btnPause").textContent = p ? "Play" : "Pause"; statusAt = 0;
  if (AC && musicWanted) p ? AC.suspend() : AC.resume();
}
function startCity() { scene = "city"; cityT0 = t; parts = []; resetFW(); }
function replay() {
  t = 0; parts = []; litDone = new Set(); puffed = new Set(); blowT = -1; scene = "cake"; resetFW();
  confetti.forEach((c, k) => Object.assign(c, newConfetti(true, k)));
  setPaused(false);
}
function updateHint() {
  const s = scene === "city" ? "Tap the sky to launch fireworks · Space pause · R replay"
    : blowT < 0 && t >= T_DONE ? "Tap the cake to blow out the candles · Space pause · R replay"
    : "Tap to pause · Space pause · R replay";
  if (s !== hintText) { hintText = s; hintEl.textContent = s; }
}
canvas.addEventListener("click", (e) => {
  if (scene === "city") {
    const r = canvas.getBoundingClientRect();
    launchAt(((e.clientX - r.left) / r.width) * COLS, ((e.clientY - r.top) / r.height) * ROWS);
    if (paused) setPaused(false);
  } else if (blowT < 0 && t >= T_DONE) {
    blowT = t;
    if (paused) setPaused(false);
  } else if (blowT < 0) setPaused(!paused);
});
document.getElementById("btnPause").addEventListener("click", () => setPaused(!paused));
document.getElementById("btnReplay").addEventListener("click", replay);
document.getElementById("btnMusic").addEventListener("click", () => setMusic(!musicWanted));
let musicTouched = false;
window.addEventListener("pointerdown", (e) => {        // browsers only allow sound after a tap, so start on the first one
  if (musicTouched) return;
  musicTouched = true;
  if (!e.target.closest("#btnMusic")) setMusic(true);
}, { once: false });
window.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button, input, summary")) return;
  if (e.code === "Space") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "r" || e.key === "R") replay();
});

// code panel: show this very script, following the step being drawn
const codeLines = SOURCE.replace(/^\n/, "").split("\n");
const phaseAt = {};
codeLines.forEach((ln, i) => { const m = /\/\/ @phase (\w+)/.exec(ln); if (m) phaseAt[m[1]] = i; });
const order = Object.keys(phaseAt).sort((a, b) => phaseAt[a] - phaseAt[b]);
const phaseEnd = {};
order.forEach((p, k) => { phaseEnd[p] = k + 1 < order.length ? phaseAt[order[k + 1]] : codeLines.length; });
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function highlight(line) {
  const re = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|(\b(?:const|let|var|function|return|for|if|else|while|of|in|new|break|continue|true|false|null)\b)|(\b[A-Za-z_$][\w$]*(?=\())/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "n" : m[4] ? "k" : "f";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
const inner = document.getElementById("codeInner");
inner.innerHTML = codeLines.map((ln, i) => `<div class="ln"><span class="no">${i + 1}</span><span class="tx">${highlight(ln) || " "}</span></div>`).join("");
const lineEls = inner.children;
let curLine = -1;
function phaseOf(t) {
  if (scene === "city") {
    const ct = t - cityT0;
    if (ct < 2.6) return ["city", ct / 2.6];
    if (ct >= FINALE_T && ct < T_TEXT + 4) return ct < T_TEXT ? ["fireworks", (ct - FINALE_T) / (T_TEXT - FINALE_T)] : ["finale", (ct - T_TEXT) / 4];
    return ["fireworks", (ct * 0.12) % 1];
  }
  if (blowT >= 0) return ["blow", (t - blowT) / (transAt() + TRANS_DUR - blowT)];
  if (t < T_SCAN) return ["setup", t / T_SCAN];
  if (t < T_DEC) return ["tiers", (t - T_SCAN) / (T_DEC - T_SCAN)];
  if (t < T_CANDLE) return ["decor", (t - T_DEC) / (T_CANDLE - T_DEC)];
  if (t < T_TITLE) return ["candles", (t - T_CANDLE) / (T_TITLE - T_CANDLE)];
  if (t < T_DONE + 1.5) return ["light", (t - T_TITLE) / (T_DONE + 1.5 - T_TITLE)];
  return ["render", ((t - T_DONE) * 0.12) % 1];
}
function updateCode(t) {
  if (document.getElementById("code").hidden) return;     // the code panel is switched off
  const [p, f] = phaseOf(t);
  const a = phaseAt[p], b = phaseEnd[p];
  const line = Math.min(b - 1, a + Math.floor(clamp(f, 0, 0.999) * (b - a)));
  if (line === curLine) return;
  if (curLine >= 0) lineEls[curLine].classList.remove("cur");
  lineEls[line].classList.add("cur");
  curLine = line;
  const lh = lineEls[0].offsetHeight || 17;
  inner.style.transform = `translateY(${-Math.max(0, line - 6) * lh}px)`;
}

// share: a QR code and a copy button for the friend's phone
const OWN_PAGE = window.self === window.top && /^https?:$/.test(location.protocol);
const SHARE_URL = (OWN_PAGE ? location.origin + location.pathname : "https://claude.ai/artifact/N7ExehxpUNrEKinYj3Ji6Q") + (NAME !== "SH" ? "#" + NAME : "");
document.getElementById("greetName").textContent = NAME === "SH" ? "소헌" : NAME;   // the greeting uses the Korean name
const urlEl = document.getElementById("shareUrl"), qrEl = document.getElementById("qr"), copyBtn = document.getElementById("btnCopy");
urlEl.value = SHARE_URL;
try {
  if (window.QRCode) new QRCode(qrEl, { text: SHARE_URL, width: 256, height: 256, colorDark: "#3b2342", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  else qrEl.hidden = true;
} catch (e) { qrEl.hidden = true; }
copyBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(SHARE_URL); copyBtn.textContent = "복사됐어요!"; }
  catch (e) { urlEl.focus(); urlEl.select(); copyBtn.textContent = "선택됨 · 복사하세요"; }
  setTimeout(() => (copyBtn.textContent = "링크 복사"), 1800);
});

window.cakeSeek = (s) => { t = s; };   // lets you jump to a moment from the console
window.cakeBlow = () => { if (blowT < 0) blowT = t; };
requestAnimationFrame(tick);
})();
</script>
